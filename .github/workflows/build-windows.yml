name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    env:
      # Windows жүгірткішінде Python шығысы cp1252 болады да, қазақша хабарларды
      # басып шығару UnicodeEncodeError береді. tools/*.py өзін-өзі UTF-8-ге
      # ауыстырады, бұл жол қосымша кепілдік (PyInstaller мен ultralytics үшін де).
      PYTHONUTF8: "1"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Fetch detector weights
        # The app downloads yolo11n.pt on its first run; fetching it here keeps the built
        # bundle self-contained, so it also works on a machine without internet.
        run: python -c "from ultralytics import YOLO; YOLO('yolo11n.pt')"

      - name: Build with PyInstaller
        shell: pwsh
        run: >
          pyinstaller --noconfirm --onedir --name ClassroomFaceApp
          --add-data "frontend;frontend"
          --add-data "backend/app/trackers;backend/app/trackers"
          --add-data ".env.example;."
          --collect-all ultralytics --collect-all insightface --collect-all onnxruntime
          --collect-all torchvision
          --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          launcher.py

      # torchvision's native extension is loaded with torch.ops.load_library(), so PyInstaller
      # does not collect it; without it every inference raises and the app silently shows no
      # boxes and no names. This step adds the missing files and refuses to ship a broken build.
      - name: Add files PyInstaller misses and verify the bundle
        run: python tools/fix_bundle.py dist/ClassroomFaceApp

      - run: Compress-Archive -Path dist/ClassroomFaceApp -DestinationPath ClassroomFaceApp-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomFaceApp-windows
          path: ClassroomFaceApp-windows.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ClassroomFaceApp-windows.zip
