name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
      - run: >
          pyinstaller --noconfirm --onedir --name ClassroomFaceApp
          --add-data "frontend;frontend" --add-data "backend/app/trackers;backend/app/trackers" --add-data ".env.example;."
          --collect-all ultralytics --collect-all insightface --collect-all onnxruntime
          --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto launcher.py
      - run: Compress-Archive -Path dist/ClassroomFaceApp -DestinationPath ClassroomFaceApp-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomFaceApp-windows
          path: ClassroomFaceApp-windows.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ClassroomFaceApp-windows.zip
